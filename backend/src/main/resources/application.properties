spring.application.name=pathocheck
server.port=8080

# 数据集可能包含较多图片。开发演示时仍建议只上传一个小型子集。
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=2GB

# CRC-VAL-HE-7K 约 7000 张图：
# 每张图包含一个 files part 和一个 relativePaths part
server.tomcat.max-part-count=30000
server.tomcat.max-parameter-count=30000

# 从 backend 目录启动时，文件会存到 backend/storage。
# 也可以改成 ../storage，使其使用工作区根目录的 storage。
pathocheck.storage.root=storage

# 单一日志文件。请确保 backend/storage/logs 已存在。
logging.file.name=storage/logs/pathocheck.log
logging.level.com.pathocheck=INFO

# -------------------- 数据库配置 --------------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/pathocheck?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${PATHOCHECK_DB_USER:root}
spring.datasource.password=${PATHOCHECK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
